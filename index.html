<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 단어 학습실</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#6b6f76; --line:#e4e0d8;
    --accent:#2f6f5e; --accent-soft:#e3efe9; --warn:#b4532a; --ok:#2f7d4f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55}
  header{max-width:960px;margin:0 auto;padding:40px 20px 12px}
  header h1{margin:0;font-size:28px;letter-spacing:-.02em}
  header p{margin:6px 0 0;color:var(--muted)}
  main{max-width:960px;margin:0 auto;padding:0 20px 60px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 12px}
  .chip{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .modes{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;width:fit-content;margin-bottom:18px}
  .modes button{border:0;background:transparent;padding:8px 16px;border-radius:9px;cursor:pointer;font:inherit;font-size:14px;color:var(--muted)}
  .modes button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .panel-head h2{margin:0;font-size:18px}
  .count{color:var(--muted);font-size:14px;font-weight:400;margin-left:6px}
  .tools{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:hover{border-color:var(--accent)}
  table{width:100%;border-collapse:collapse}
  td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
  td.n{width:40px;color:var(--muted);font-variant-numeric:tabular-nums}
  td.en{font-weight:600;width:42%}
  .hide-ko td.ko span, .hide-en td.en span{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .15s}
  td span.shown{filter:none!important}
  .note{font-size:12px;color:var(--warn);margin-left:6px;font-weight:400}
  /* flashcards */
  .card-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0}
  .flash{width:min(440px,100%);height:240px;perspective:1000px;cursor:pointer}
  .flash-inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .flash.flipped .flash-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:16px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;backface-visibility:hidden;padding:20px;text-align:center}
  .front{background:#fff}
  .back{background:var(--accent-soft);color:var(--accent);transform:rotateY(180deg);font-size:26px}
  .hint{color:var(--muted);font-size:13px}
  /* quiz */
  .q-word{font-size:32px;font-weight:700;text-align:center;margin:18px 0 6px}
  .q-progress{text-align:center;color:var(--muted);font-size:14px}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px auto 0;max-width:560px}
  .opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px;font:inherit;font-size:16px;cursor:pointer;text-align:center}
  .opt.correct{background:#e4f3ea;border-color:var(--ok);color:var(--ok);font-weight:600}
  .opt.wrong{background:#fbeae3;border-color:var(--warn);color:var(--warn)}
  .result{text-align:center;padding:20px 0}
  .result .big{font-size:44px;font-weight:800;color:var(--accent)}
  .miss{max-width:560px;margin:14px auto 0;text-align:left}
  footer{max-width:960px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px}
  @media (max-width:560px){.options{grid-template-columns:1fr}}
  /* print test sheet */
  #printSheet{display:none}
  @media print{
    body{background:#fff}
    header,main,footer{display:none}
    #printSheet{display:block;font-size:12pt;padding:0 10mm}
    #printSheet h2{font-size:15pt;margin:0 0 4px}
    #printSheet .meta{margin-bottom:12px}
    #printSheet ol{columns:2;column-gap:12mm;padding-left:18px}
    #printSheet li{break-inside:avoid;padding:5px 0;border-bottom:1px solid #ccc}
  }
</style>
</head>
<body>
<header>
  <h1>영어 단어 학습실</h1>
  <p>단어장을 보고, 카드로 외우고, 퀴즈로 확인해 보세요.</p>
</header>

<main>
  <div class="bar" id="setBar" role="group" aria-label="단어 세트"></div>

  <div class="modes" role="tablist">
    <button role="tab" data-mode="list" aria-selected="true">단어장</button>
    <button role="tab" data-mode="cards" aria-selected="false">플래시카드</button>
    <button role="tab" data-mode="quiz" aria-selected="false">퀴즈</button>
  </div>

  <section class="panel" id="panel"></section>
</main>

<footer>단어를 추가하려면 index.html의 SETS 목록에 새 세트를 넣으면 됩니다.</footer>

<div id="printSheet"></div>

<script>
/* ===== 단어 데이터: 새 시험이 생기면 여기에 세트를 추가하세요 ===== */
const SETS = [
  { id:"d1", title:"10/12 · Day 1 해변", words:[
    ["sand","모래"],["wave","파도"],["shell","조개껍데기"],["suntan","햇볕에 탐"],["raft","뗏목"],
    ["yacht","요트"],["sunglasses","선글라스"],["parasol","파라솔"],["mat","매트, 돗자리"],["vacation","휴가, 방학"],
    ["whistle","호루라기"],["lifeboat","구명보트"],["scuba","스쿠버 (잠수 장비)"],["swimsuit","수영복"],["sunblock","자외선 차단제"],
    ["cooler","아이스박스"],["blanket","담요"],["shade","그늘"],["shore","해안, 물가"],["sunbathe","일광욕하다","원문: sunbath"],
    ["lifeguard","인명 구조원"],["float","뜨다"],["flipper","오리발"],["binoculars","쌍안경"],["snorkel","스노클"],
    ["pebble","조약돌"],["expose","노출시키다"],["all day long","하루 종일"],["look forward to ~ing","~하기를 고대하다"],["throw away","버리다"]
  ]},
  { id:"d2", title:"10/12 · Day 2 기념일·축제", words:[
    ["festival","축제"],["Valentine","밸런타인"],["blow","(입으로) 불다"],["Christmas","크리스마스","원문: Chirstmas"],["candy","사탕"],
    ["year","해, 년"],["wish","소원; 바라다"],["mask","가면"],["celebrate","기념하다, 축하하다"],["gather","모이다"],
    ["honeymoon","신혼여행"],["Easter","부활절"],["hide","숨기다, 숨다"],["invitation","초대, 초대장"],["Eve","(축일) 전날 밤"],
    ["decorate","장식하다"],["witch","마녀"],["trick","속임수, 장난"],["costume","의상, 분장"],["turkey","칠면조"],
    ["anniversary","기념일"],["congratulate","축하하다"],["Thanksgiving","추수감사절"],["Halloween","핼러윈"],["reindeer","순록"],
    ["lantern","등불, 랜턴"],["stuff","물건, 것"],["crowded","붐비는"],["take place","열리다, 일어나다"],["be similar to","~와 비슷하다"]
  ]},
  { id:"d3", title:"10/12 · Day 3 나들이", words:[
    ["seesaw","시소"],["walk","걷다; 산책"],["ride","타다"],["bench","벤치"],["event","행사"],
    ["picnic","소풍"],["zoo","동물원"],["concert","음악회, 콘서트"],["visit","방문하다"],["rope","밧줄"],
    ["backpack","배낭"],["slide","미끄럼틀"],["fountain","분수"],["playground","놀이터"],["swing","그네"],
    ["sleeping bag","침낭"],["campfire","모닥불"],["fishing rod","낚싯대"],["sail","항해하다"],["amusement","즐거움, 오락"],
    ["merry-go-round","회전목마"],["flea market","벼룩시장"],["botanical garden","식물원"],["aquarium","수족관"],["thermos","보온병"],
    ["peak","산꼭대기, 정상"],["rapids","급류"],["get together","모이다"],["because of","~ 때문에"],["be filled with","~로 가득 차다"]
  ]},
  { id:"d4", title:"10/12 · Day 4 자연", words:[
    ["flood","홍수"],["hurricane","허리케인"],["thunder","천둥"],["lightning","번개"],["creature","생물"],
    ["valley","계곡, 골짜기"],["polar","극지방의"],["breeze","산들바람"],["cliff","절벽"],["volcano","화산"],
    ["natural","자연의"],["forest","숲"],["desert","사막"],["explore","탐험하다"],["stream","시내, 개울"],
    ["lake","호수"],["waterfall","폭포"],["river","강"],["ocean","대양, 바다"],["coast","해안"],
    ["tide","조수 (밀물과 썰물)"],["landslide","산사태"],["earthquake","지진"],["element","요소, 원소"],["appear","나타나다"],
    ["source","근원, 원천"],["disaster","재난"],["food chain","먹이사슬"],["find out","알아내다"],["right away","즉시, 곧바로"]
  ]},
  { id:"d5", title:"10/12 · Day 5 여가·쇼핑·음식", words:[
    ["knit","뜨개질하다"],["leisure","여가"],["involve","포함하다, 관련시키다"],["outdoor","야외의"],["prize","상"],
    ["competition","대회, 경쟁"],["batter","타자"],["athlete","운동선수"],["defender","수비수"],["referee","심판"],
    ["cheap","값이 싼"],["expensive","비싼"],["exchange","교환하다"],["tag","가격표, 꼬리표"],["change","거스름돈; 바꾸다"],
    ["display","진열하다"],["stand","가판대; 서다"],["retail","소매"],["discount","할인"],["brand-name","유명 상표의"],
    ["auction","경매"],["drop by","잠깐 들르다"],["reasonable","합리적인, 적당한"],["quality","품질"],["order","주문하다"],
    ["straw","빨대"],["serve","(음식을) 내다"],["beverage","음료"],["wrap","싸다, 포장하다","원문: warp"],["ingredient","재료"],
    ["appetite","식욕"],["recommend","추천하다"],["be ready to","~할 준비가 되다"],["substance","물질"],["photosynthesis","광합성"],
    ["process","과정"],["occur","일어나다, 발생하다"],["take in","받아들이다, 흡수하다"]
  ]}
];

/* ===== 앱 ===== */
let cur = SETS[0], mode = "list";
const $ = s => document.querySelector(s);
const panel = $("#panel");
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderBar(){
  $("#setBar").innerHTML = SETS.map(s =>
    `<button class="chip" data-id="${s.id}" aria-pressed="${s.id===cur.id}">${esc(s.title)}</button>`).join("");
}
$("#setBar").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  cur = SETS.find(s => s.id === b.dataset.id); renderBar(); render();
});
document.querySelector(".modes").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  mode = b.dataset.mode;
  document.querySelectorAll(".modes button").forEach(x => x.setAttribute("aria-selected", x===b));
  render();
});

function render(){ ({list:renderList, cards:renderCards, quiz:renderQuiz})[mode](); }

/* 단어장 */
function renderList(){
  panel.innerHTML = `
    <div class="panel-head">
      <h2>${esc(cur.title)}<span class="count">${cur.words.length}단어</span></h2>
      <div class="tools">
        <button class="btn" id="hideKo">뜻 가리기</button>
        <button class="btn" id="hideEn">영어 가리기</button>
        <button class="btn" id="printBtn">시험지 인쇄</button>
      </div>
    </div>
    <table id="tbl"><tbody>${cur.words.map((w,i)=>`
      <tr><td class="n">${i+1}</td>
      <td class="en"><span>${esc(w[0])}</span>${w[2]?`<span class="note">${esc(w[2])}</span>`:""}</td>
      <td class="ko"><span>${esc(w[1])}</span></td></tr>`).join("")}
    </tbody></table>`;
  const tbl = $("#tbl");
  $("#hideKo").onclick = e => { tbl.classList.toggle("hide-ko"); e.target.textContent = tbl.classList.contains("hide-ko") ? "뜻 보이기" : "뜻 가리기"; tbl.querySelectorAll(".shown").forEach(x=>x.classList.remove("shown")); };
  $("#hideEn").onclick = e => { tbl.classList.toggle("hide-en"); e.target.textContent = tbl.classList.contains("hide-en") ? "영어 보이기" : "영어 가리기"; tbl.querySelectorAll(".shown").forEach(x=>x.classList.remove("shown")); };
  tbl.addEventListener("click", e => { const s = e.target.closest("td span:not(.note)"); if(s) s.classList.toggle("shown"); });
  $("#printBtn").onclick = printSheet;
}

/* 시험지 인쇄: 영어를 보고 뜻 쓰기 (순서 섞음) */
function printSheet(){
  const words = shuffle(cur.words);
  $("#printSheet").innerHTML = `
    <h2>${esc(cur.title)} 단어 시험</h2>
    <div class="meta">이름: ____________ &nbsp;&nbsp; 점수: ______ / ${words.length}</div>
    <ol>${words.map(w=>`<li><b>${esc(w[0])}</b> : ______________________</li>`).join("")}</ol>`;
  window.print();
}

/* 플래시카드 */
function renderCards(){
  let deck = [...cur.words], i = 0;
  panel.innerHTML = `
    <div class="panel-head">
      <h2>${esc(cur.title)}<span class="count" id="pos"></span></h2>
      <div class="tools"><button class="btn" id="shuf">섞기</button></div>
    </div>
    <div class="card-wrap">
      <div class="flash" id="flash"><div class="flash-inner">
        <div class="face front" id="front"></div><div class="face back" id="back"></div>
      </div></div>
      <div class="tools">
        <button class="btn" id="prev">← 이전</button>
        <button class="btn primary" id="next">다음 →</button>
      </div>
      <div class="hint">카드를 누르면 뜻이 보여요 · 키보드 ← → 와 스페이스도 돼요</div>
    </div>`;
  const flash = $("#flash");
  const show = () => { flash.classList.remove("flipped"); $("#front").textContent = deck[i][0]; $("#back").textContent = deck[i][1]; $("#pos").textContent = `${i+1} / ${deck.length}`; };
  flash.onclick = () => flash.classList.toggle("flipped");
  $("#next").onclick = () => { i = (i+1) % deck.length; show(); };
  $("#prev").onclick = () => { i = (i-1+deck.length) % deck.length; show(); };
  $("#shuf").onclick = () => { deck = shuffle(deck); i = 0; show(); };
  show();
}
document.addEventListener("keydown", e => {
  if(mode !== "cards") return;
  if(e.key === "ArrowRight") $("#next")?.click();
  if(e.key === "ArrowLeft") $("#prev")?.click();
  if(e.key === " "){ e.preventDefault(); $("#flash")?.click(); }
});

/* 퀴즈: 영어를 보고 뜻 고르기 (10문제) */
function renderQuiz(){
  const qs = shuffle(cur.words).slice(0, Math.min(10, cur.words.length));
  let k = 0, score = 0, misses = [];
  const ask = () => {
    if(k >= qs.length) return finish();
    const [en, ko] = qs[k];
    const others = shuffle(cur.words.filter(w => w[0] !== en)).slice(0,3).map(w=>w[1]);
    const opts = shuffle([ko, ...others]);
    panel.innerHTML = `
      <div class="q-progress">${esc(cur.title)} · ${k+1} / ${qs.length}</div>
      <div class="q-word">${esc(en)}</div>
      <div class="options">${opts.map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div>`;
    panel.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      panel.querySelectorAll(".opt").forEach(x => { x.disabled = true; if(x.textContent === ko) x.classList.add("correct"); });
      if(b.textContent === ko) score++; else { b.classList.add("wrong"); misses.push(qs[k]); }
      k++; setTimeout(ask, 900);
    });
  };
  const finish = () => {
    panel.innerHTML = `
      <div class="result">
        <div class="big">${score} / ${qs.length}</div>
        <p>${score===qs.length ? "완벽해요!" : "틀린 단어를 한 번 더 확인해 보세요."}</p>
        ${misses.length ? `<table class="miss"><tbody>${misses.map(w=>`<tr><td class="en">${esc(w[0])}</td><td>${esc(w[1])}</td></tr>`).join("")}</tbody></table>` : ""}
        <p><button class="btn primary" id="again">다시 풀기</button></p>
      </div>`;
    $("#again").onclick = renderQuiz;
  };
  ask();
}

renderBar(); render();
</script>
</body>
</html>
